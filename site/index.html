<title>Find 中古相机</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Jost:wght@500;600&family=Long+Cang&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@400;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* 版式概念：一台相机的机身。页面底是颗粒蒙皮，导航是镀铬顶盖，内容放在拉丝铝板、纸质吊牌、丝绒展柜和仪器面板上；所有控件都是相机上真实存在的机构：滚花转盘、卷片拨杆、光圈环、对焦环、拨动开关。整页只有一种外观（深色机身）。 */
:root{
  color-scheme:dark;
  --leather:#1c1b19; --leather-2:#25231f; --velvet:#151214;
  --chrome-hi:#fbfbf9; --chrome:#d4d6d3; --chrome-mid:#a8abaa; --chrome-lo:#767a7b;
  --paint:#161718; --paint-hi:#3c3e41;
  --engrave:#25272a; --engrave-light:#efede6;
  --red:#d0301f; --orange:#e98a2c; --green:#3fa66b;
  --paper:#ece5d2; --paper-2:#e2d9c1; --paper-ink:#2a261f; --paper-ink-2:#6a6152; --paper-rule:#cbbfa3;
  --led-green:#71ff95; --led-amber:#ffb53f; --led-red:#ff4b3a;
  --lcd:#a9b499; --lcd-ink:#1d2718;
  --brass:#c9a85f; --brass-lo:#806633;
  --text:#ebe8e0; --text-2:#b6b0a5; --text-3:#827c72;
  --g-chrome:linear-gradient(180deg,#fcfcfa 0%,#e2e3e0 16%,#bfc2c1 44%,#a2a6a6 52%,#d4d6d4 72%,#f0f0ee 100%);
  --g-paint:linear-gradient(180deg,#46484c 0%,#232427 22%,#151618 60%,#1e1f22 100%);
  --f-cn:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-serif:"Noto Serif SC","Songti SC","STSong",serif;
  --f-eng:"Jost","Futura","Century Gothic",sans-serif;
  --f-num:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-lcd:"Share Tech Mono",ui-monospace,Menlo,monospace;
  --f-hand:"Long Cang","Kaiti SC","STKaiti",cursive;
}
*{box-sizing:border-box}
html{background:var(--leather)}
body{margin:0;min-height:100%;color:var(--text);font-family:var(--f-cn);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;
  background-color:var(--leather);
  background-image:radial-gradient(ellipse 130% 95% at 50% 45%,transparent 58%,rgba(0,0,0,.45) 100%),radial-gradient(ellipse 120% 60% at 50% -10%,rgba(255,250,240,.07),transparent 60%),var(--leather-tex,none);
  background-attachment:fixed,fixed,scroll}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#cfd1ce}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
img{display:block}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 材质 ---------- */
.chrome{position:relative;color:var(--engrave);background-image:var(--brushed,none),var(--g-chrome);background-blend-mode:soft-light,normal;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(0,0,0,.25),0 2px 0 #4b4e4f,0 3px 0 #111,0 14px 30px rgba(0,0,0,.55)}
.paint{position:relative;color:var(--engrave-light);background-image:var(--brushed-dark,none),var(--g-paint);background-blend-mode:soft-light,normal;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.6),0 3px 0 #050505,0 14px 30px rgba(0,0,0,.6)}
.paper{position:relative;color:var(--paper-ink);background-image:var(--paper-tex,none),linear-gradient(180deg,#f0e9d7,#e6ddc6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 3px rgba(0,0,0,.35),0 16px 30px rgba(0,0,0,.45)}
.velvet{position:relative;background-color:var(--velvet);background-image:radial-gradient(ellipse 70% 62% at 50% 34%,rgba(255,236,214,.17),rgba(255,236,214,.04) 55%,transparent 75%),var(--velvet-tex,none);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 18px 30px rgba(0,0,0,.6),inset 0 -10px 24px rgba(0,0,0,.5)}
.engr{font-family:var(--f-eng);text-transform:uppercase;letter-spacing:.18em;font-weight:500;font-size:11px;color:#3a3d40;text-shadow:0 1px 0 rgba(255,255,255,.85)}
.paint .engr,.engr.light{color:#e9e7df;text-shadow:0 -1px 0 rgba(0,0,0,.8)}
.deboss{color:#141311;text-shadow:0 1px 0 rgba(255,255,255,.09),0 -1px 0 rgba(0,0,0,.75)}
.foil{background:linear-gradient(180deg,#fbfaf6 0%,#cfd0cc 38%,#8f9291 52%,#e9e9e6 70%,#b9bbba 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.85))}
.screw{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#c4c6c5 42%,#6c7071 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.55);pointer-events:none}
.screw::after{content:"";position:absolute;left:1.5px;right:1.5px;top:50%;height:1.8px;margin-top:-.9px;border-radius:1px;background:#4f5253;box-shadow:0 1px 0 rgba(255,255,255,.55);transform:rotate(var(--r,28deg))}
.screw.tl{top:8px;left:8px}.screw.tr{top:8px;right:8px}.screw.bl{bottom:8px;left:8px}.screw.br{bottom:8px;right:8px}
.paint .screw{background:radial-gradient(circle at 35% 30%,#9a9c9d,#4a4c4e 45%,#1a1b1c 100%)}
.paint .screw::after{background:#0b0b0b;box-shadow:0 1px 0 rgba(255,255,255,.15)}

/* ---------- 顶盖导航 ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-radius:0 0 4px 4px}
.top .wrap{display:flex;align-items:center;gap:18px;height:62px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo .knob{width:30px;height:30px;border-radius:50%;background:repeating-conic-gradient(#f0f0ed 0 4deg,#7d8182 4deg 8deg);box-shadow:0 2px 3px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.25);position:relative}
.logo .knob::after{content:"";position:absolute;inset:5px;border-radius:50%;background:conic-gradient(from 30deg,#c7c9c8,#fbfbf9,#a8abaa,#ececea,#b3b6b5,#f7f7f5,#c7c9c8);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.logo b{font-family:var(--f-eng);font-weight:600;font-size:21px;letter-spacing:.34em;color:#2a2c2f;text-shadow:0 1px 0 rgba(255,255,255,.9),0 -1px 0 rgba(0,0,0,.18)}
.nav{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{position:relative;text-decoration:none;padding:6px 12px 10px;font-size:14px;font-weight:500;color:#34373a;text-shadow:0 1px 0 rgba(255,255,255,.85);white-space:nowrap}
.nav a::after{content:"";position:absolute;left:50%;bottom:2px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:transparent}
.nav a[aria-current="page"]{color:#111}
.nav a[aria-current="page"]::after{background:var(--red);box-shadow:inset 0 -1px 1px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.7)}
.nav a[hidden]{display:none}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.fc{display:flex;align-items:center;gap:8px;text-decoration:none;color:#34373a}
.fc-win{width:38px;height:38px;border-radius:50%;background:#0c0c0c;display:grid;place-items:center;box-shadow:0 0 0 3px #b9bcbb,0 0 0 4px #6f7374,inset 0 3px 6px #000;position:relative;overflow:hidden}
.fc-win span{font-family:var(--f-num);font-weight:600;font-size:17px;color:#f2f0ea;line-height:1}
.fc-win::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(150deg,rgba(255,255,255,.28),transparent 45%)}
.fc small{font-size:12px;line-height:1.25;text-shadow:0 1px 0 rgba(255,255,255,.8)}
@media (max-width:760px){.fc small{display:none}.top .wrap{gap:10px}.logo b{font-size:18px;letter-spacing:.26em}.nav a{padding:6px 8px 10px;font-size:13px}}
@media (max-width:520px){.logo b{display:none}.top-r .snd{display:none}}

.filmband{background:#191512;border-top:1px solid #000;border-bottom:1px solid #000;overflow:hidden;height:34px;position:relative}
.filmband::before,.filmband::after{content:"";position:absolute;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,transparent 0 7px,#d9d2c4 7px 14px,transparent 14px 21px);opacity:.75}
.filmband::before{top:2px}.filmband::after{bottom:2px}
.filmband p{font-family:var(--f-lcd);font-size:11px;color:#e39b55;white-space:nowrap;line-height:34px;letter-spacing:.08em;padding-left:16px}

/* ---------- 机械按键 ---------- */
.key{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-cn);font-weight:700;font-size:15px;letter-spacing:.06em;color:#24262a;
  padding:12px 22px;border-radius:7px;text-decoration:none;
  background-image:var(--brushed,none),linear-gradient(180deg,#fefefc,#e0e1de 52%,#c6c8c6);background-blend-mode:soft-light,normal;
  text-shadow:0 1px 0 rgba(255,255,255,.85);
  box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,0,0,.12),0 4px 0 #6d7172,0 5px 0 #202122,0 11px 18px rgba(0,0,0,.55);
  transform:translateY(0);transition:transform .06s,box-shadow .06s}
.key:active,.key.is-down{transform:translateY(3px);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,0,0,.12),0 1px 0 #6d7172,0 2px 0 #202122,0 4px 8px rgba(0,0,0,.5)}
.key.dark{color:var(--engrave-light);text-shadow:0 -1px 0 #000;background-image:var(--brushed-dark,none),linear-gradient(180deg,#4a4c50,#232427 50%,#16171a);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -2px 0 rgba(0,0,0,.4),0 4px 0 #0a0a0a,0 5px 0 #000,0 11px 18px rgba(0,0,0,.6)}
.key.dark:active,.key.dark.is-down{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 0 #0a0a0a,0 2px 0 #000,0 4px 8px rgba(0,0,0,.5)}
.key .dot{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a7a,var(--red) 55%,#7b160c);box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.key.big{padding:16px 26px;font-size:16px}
.key[disabled]{opacity:.5;cursor:not-allowed}

/* 快门按钮 */
.release{appearance:none;border:0;cursor:pointer;width:58px;height:58px;border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 50% 50%,#2a2b2e 0 44%,transparent 45%),radial-gradient(circle at 38% 30%,#ffffff,#cfd1cf 40%,#7c8081 100%);
  box-shadow:0 4px 0 #3c3f40,0 5px 0 #000,0 10px 16px rgba(0,0,0,.6),inset 0 1px 0 #fff}
.release::after{content:"";position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff9c8c,var(--red) 55%,#6e140b);box-shadow:inset 0 -2px 3px rgba(0,0,0,.4),0 0 0 2px #111}
.release:active{transform:translateY(3px);box-shadow:0 1px 0 #3c3f40,0 2px 0 #000,0 4px 8px rgba(0,0,0,.5),inset 0 1px 0 #fff}

/* 拨动开关 */
.sw{appearance:none;background:none;border:0;padding:4px 0;display:inline-flex;align-items:center;gap:12px;cursor:pointer;text-align:left;color:inherit}
.sw-track{position:relative;flex:none;width:50px;height:24px;border-radius:5px;background:linear-gradient(180deg,#070707,#262626);box-shadow:inset 0 2px 4px #000,0 1px 0 rgba(255,255,255,.35)}
.sw-track::before,.sw-track::after{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-eng);font-size:7px;letter-spacing:.1em;color:#8b8b85}
.sw-track::before{content:"OFF";right:4px}.sw-track::after{content:"ON";left:5px}
.sw-knob{position:absolute;z-index:1;top:2px;left:2px;width:24px;height:20px;border-radius:3px;transition:left .12s cubic-bezier(.3,1.5,.6,1);
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),linear-gradient(180deg,#ffffff,#c9cbca 55%,#8f9394);box-shadow:0 1px 2px rgba(0,0,0,.7),inset 0 1px 0 #fff}
.sw[aria-checked="true"] .sw-knob{left:24px}
.sw .led{flex:none}
.sw-label{font-size:14px;line-height:1.4}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;--c:var(--led-green);background:radial-gradient(circle at 35% 30%,#ffffff 0 12%,var(--c) 45%,#0a2a12 100%);box-shadow:0 0 0 2px #0e0e0e,0 0 10px var(--c)}
.led.off{background:radial-gradient(circle at 35% 30%,#666 0 10%,#2a2d2a 60%);box-shadow:0 0 0 2px #0e0e0e}
.led.amber{--c:var(--led-amber);background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--c) 45%,#3a2200 100%)}
.led.red{--c:var(--led-red);background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--c) 45%,#3a0a00 100%)}

/* 滚花转盘 */
.dial{position:relative;width:var(--size,180px);height:var(--size,180px);touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
.dial-shadow{position:absolute;inset:-4%;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.55) 58%,transparent 72%);transform:translateY(6%)}
.dial-knob{position:absolute;inset:0;border-radius:50%;cursor:grab;outline:none;
  background:repeating-conic-gradient(from 0deg,#f1f2ef 0deg 2.4deg,#5f6364 2.4deg 4.8deg);
  box-shadow:0 0 0 1px #2a2c2d,inset 0 0 0 2px rgba(0,0,0,.25);transform:rotate(var(--rot,0deg));transition:transform .22s cubic-bezier(.25,1.45,.5,1)}
.dial.dragging .dial-knob{transition:none;cursor:grabbing}
.dial-face{position:absolute;inset:8%;border-radius:50%;background:conic-gradient(from 15deg,#c8cac9,#f8f8f6 12%,#a6a9a8 26%,#ececea 40%,#b2b5b4 55%,#f7f7f5 70%,#a9acab 84%,#c8cac9);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 2px 3px rgba(255,255,255,.8),inset 0 -4px 8px rgba(0,0,0,.25)}
.dial-cap{position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#c6c8c7 50%,#8a8e8f);box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.25)}
.dial-lab{position:absolute;left:50%;top:50%;width:0;height:0}
.dial-lab span{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--f-num);font-weight:600;font-size:var(--fs,13px);color:#26282b;text-shadow:0 1px 0 rgba(255,255,255,.75);cursor:pointer;line-height:1}
.dial-lab span.cn{font-family:var(--f-cn);font-weight:700;font-size:calc(var(--fs,13px) - 1px)}
.dial-lab span.tick{font-size:6px;color:#55595b}
.dial-index{position:absolute;left:50%;top:-14px;width:0;height:0;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:11px solid var(--red);filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.dial.black .dial-knob{background:repeating-conic-gradient(from 0deg,#4a4c4f 0deg 2.4deg,#0c0c0d 2.4deg 4.8deg)}
.dial.black .dial-face{background:conic-gradient(from 15deg,#1a1b1d,#3b3d40 12%,#121314 26%,#2f3134 40%,#141516 55%,#36383b 70%,#111213 84%,#1a1b1d);box-shadow:inset 0 0 0 1px #000,inset 0 2px 2px rgba(255,255,255,.12)}
.dial.black .dial-lab span{color:#f1efe8;text-shadow:0 -1px 0 #000}
.dial.black .dial-lab span.hot{color:var(--orange)}
.dial.black .dial-cap{background:radial-gradient(circle at 40% 35%,#55585b,#1c1d1f 60%,#0b0b0c)}

/* 卷片拨杆 */
.advance{position:relative;width:250px;height:132px;touch-action:none;user-select:none;-webkit-user-select:none}
.adv-hub{position:absolute;left:18px;top:28px;width:76px;height:76px;border-radius:50%;background:repeating-conic-gradient(#eeefec 0 3deg,#6a6e6f 3deg 6deg);box-shadow:0 6px 12px rgba(0,0,0,.6),0 0 0 1px #222}
.adv-hub::after{content:"";position:absolute;inset:9px;border-radius:50%;background:conic-gradient(from 10deg,#c9cbca,#fafaf8,#a5a8a7,#ebebe9,#b0b3b2,#f6f6f4,#c9cbca);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.adv-arm{position:absolute;left:56px;top:56px;width:178px;height:20px;margin-top:-10px;transform-origin:0 50%;transform:rotate(var(--a,0deg));cursor:grab;outline:none;transition:transform .32s cubic-bezier(.2,1.6,.4,1)}
.advance.dragging .adv-arm{transition:none;cursor:grabbing}
.adv-arm::before{content:"";position:absolute;left:0;top:3px;right:30px;height:14px;border-radius:7px;background:var(--g-chrome);box-shadow:0 4px 8px rgba(0,0,0,.55),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.3)}
.adv-arm::after{content:"";position:absolute;right:0;top:0;width:44px;height:20px;border-radius:9px;background:linear-gradient(180deg,#3c3e41,#121314 60%,#202124);box-shadow:0 4px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.2)}
.adv-cap{position:absolute;left:43px;top:53px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#c3c5c4 50%,#7e8283);box-shadow:0 2px 3px rgba(0,0,0,.6);pointer-events:none;z-index:2}
.adv-hint{position:absolute;right:4px;bottom:0;font-size:12px;color:var(--text-2)}

/* 光圈环（分段选择） */
.fstops{position:relative;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));padding:14px 6px 10px;border-radius:6px;
  background:linear-gradient(180deg,#2b2c2f,#0f1011 45%,#1c1d1f);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 0 #050505,0 8px 16px rgba(0,0,0,.5)}
.fstops::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;border-radius:6px 6px 0 0;background:repeating-linear-gradient(90deg,#3d3f42 0 3px,#0c0c0d 3px 7px);box-shadow:inset 0 -1px 0 #000}
.fstops button{appearance:none;background:none;border:0;cursor:pointer;padding:6px 0 12px;font-family:var(--f-num);font-weight:600;font-size:17px;color:#e9e7df;text-shadow:0 -1px 0 #000;position:relative;line-height:1.1}
.fstops button small{display:block;font-family:var(--f-cn);font-weight:400;font-size:10px;color:#8d8a83;margin-top:3px;letter-spacing:.04em}
.fstops button::after{content:"";position:absolute;left:50%;bottom:0;width:2px;height:6px;margin-left:-1px;background:#77736b}
.fstops button[aria-checked="true"]{color:var(--orange)}
.fstops button[aria-checked="true"]::after{bottom:-6px;width:0;height:0;margin-left:-6px;background:none;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:8px solid var(--red)}

/* 对焦环滑块 */
.ring{position:relative;height:74px;border-radius:6px;background:linear-gradient(180deg,#303134,#111214 40%,#1d1e20);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 0 #050505,0 8px 16px rgba(0,0,0,.5);overflow:hidden}
.ring::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:repeating-linear-gradient(90deg,#45474a 0 2px,#0c0c0d 2px 5px);box-shadow:inset 0 -1px 0 #000}
.ring-scale{position:absolute;left:14px;right:14px;top:22px;bottom:8px}
.ring-scale i{position:absolute;top:0;width:1px;height:7px;background:#cfcbc2}
.ring-scale i.major{height:11px}
.ring-scale b{position:absolute;top:14px;transform:translateX(-50%);font-family:var(--f-num);font-weight:600;font-size:12px;color:#ebe8df;white-space:nowrap}
.ring-scale b.o{color:var(--orange)}
.ring input{position:absolute;left:7px;right:7px;width:calc(100% - 14px);top:16px;height:54px;margin:0;background:none;-webkit-appearance:none;appearance:none;pointer-events:none}
.ring input::-webkit-slider-runnable-track{background:none;height:54px}
.ring input::-moz-range-track{background:none;height:54px}
.ring input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:16px;height:52px;border:0;border-radius:3px;cursor:grab;
  background:linear-gradient(90deg,transparent 7px,var(--red) 7px 9px,transparent 9px),linear-gradient(180deg,#fff,#c9cbca 50%,#8e9293);box-shadow:0 2px 5px rgba(0,0,0,.8)}
.ring input::-moz-range-thumb{pointer-events:auto;width:16px;height:52px;border:0;border-radius:3px;cursor:grab;
  background:linear-gradient(90deg,transparent 7px,var(--red) 7px 9px,transparent 9px),linear-gradient(180deg,#fff,#c9cbca 50%,#8e9293);box-shadow:0 2px 5px rgba(0,0,0,.8)}

/* 液晶 */

/* 纸吊牌 */
.tag{position:relative;border-radius:4px 4px 6px 6px;padding:26px 18px 16px}
.tag::before{content:"";position:absolute;top:9px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle,#1d1c1a 0 3px,#b7b3a8 3.5px 5px,#77736a 6px);box-shadow:0 1px 0 rgba(255,255,255,.6)}
.stamp{display:inline-grid;place-items:center;width:62px;height:62px;border-radius:50%;border:2.5px solid var(--red);color:var(--red);font-family:var(--f-num);font-weight:700;font-size:26px;line-height:1;transform:rotate(-12deg);
  box-shadow:0 0 0 3px transparent,inset 0 0 0 3px transparent;position:relative;opacity:.88}
.stamp::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid var(--red)}
.stamp small{display:block;font-family:var(--f-cn);font-size:8px;font-weight:700;letter-spacing:.1em;margin-top:-6px}

/* ---------- 通用版块 ---------- */
.page{padding-block:34px 70px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:64px 0 22px}
.sec-h h2{font-family:var(--f-serif);font-weight:700;font-size:clamp(24px,3vw,32px);line-height:1.3}
.sec-h p{color:var(--text-2);max-width:36em;margin-top:6px}
.crumb{font-size:13px;color:var(--text-3)}
.crumb a{text-decoration:none;color:var(--text-2)}
.crumb a:hover{color:var(--text)}

/* ---------- 首页 ---------- */
.hero-title{font-family:var(--f-serif);font-weight:700;font-size:clamp(30px,5vw,58px);line-height:1.25;letter-spacing:.02em;max-width:15em}
.hero-sub{color:var(--text-2);font-size:16px;max-width:34em;margin-top:14px}
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:26px;margin-top:34px;align-items:stretch}
.hero-stage{border-radius:10px;min-height:420px;display:flex;flex-direction:column;justify-content:center;padding:28px 20px 18px;overflow:hidden}
.hero-stage .cam{width:100%;max-width:560px;margin:0 auto}
.hero-stage .cap{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:12px;color:#8f877e;padding-inline:8px}
.cam svg{display:block;width:100%;height:auto;filter:drop-shadow(0 26px 22px rgba(0,0,0,.65)) drop-shadow(0 4px 4px rgba(0,0,0,.6))}
.cam.reflect svg{-webkit-box-reflect:below -14px linear-gradient(transparent 62%,rgba(255,255,255,.16))}
.hero-panel{border-radius:10px;padding:26px 26px 24px;display:flex;flex-direction:column;gap:14px}
.hero-panel .row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.hero-panel h2{font-family:var(--f-cn);font-weight:900;font-size:clamp(24px,2.6vw,32px);line-height:1.2;color:#1f2124;text-shadow:0 1px 0 rgba(255,255,255,.9)}
.hero-panel .meta{font-size:13px;color:#4a4e52}
.hero-panel .line{font-family:var(--f-serif);font-size:16px;color:#2b2e31;line-height:1.8}
.hero-panel .price{font-family:var(--f-num);font-weight:600;font-size:40px;line-height:1;color:#1d1f22}
.hero-panel .price small{font-size:20px;margin-right:2px}
.hero-panel .acts{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.hero-panel .adv-wrap{margin-top:auto;border-top:1px solid rgba(0,0,0,.18);box-shadow:0 1px 0 rgba(255,255,255,.7) inset;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.counter{display:flex;align-items:center;gap:10px}
.counter-win{width:58px;height:58px;border-radius:50%;background:#0b0b0b;position:relative;overflow:hidden;box-shadow:0 0 0 4px #b6b9b8,0 0 0 5px #5e6263,inset 0 4px 8px #000}
.counter-disc{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.counter-disc span{position:absolute;left:50%;top:50%;font-family:var(--f-num);font-weight:600;font-size:13px;color:#e9e6de;transform-origin:0 0}
.counter-win::before{content:"";position:absolute;left:50%;top:5px;width:0;height:0;margin-left:-4px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--red);z-index:2}
.counter-win::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(150deg,rgba(255,255,255,.3),transparent 50%);z-index:3}

.plaques{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:26px}
.plaque{border-radius:6px;padding:18px 18px 16px 18px;background-image:var(--brushed,none),linear-gradient(180deg,#e7cf93,#c4a35d 45%,#a98a45 55%,#d8bd7c);background-blend-mode:soft-light,normal;color:#3b2c0e;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.25),0 3px 0 #4d3c17,0 10px 20px rgba(0,0,0,.5);position:relative}

  background:linear-gradient(180deg,#fff,#d6d8d6 55%,#b4b7b6);box-shadow:0 2px 0 #4f5354,0 4px 8px rgba(0,0,0,.5),inset 0 1px 0 #fff}

/* ---------- 材质贴图（运行时生成） ---------- */
function rng(seed){let h=1779033703^String(seed).length;for(const ch of String(seed)){h=Math.imul(h^ch.charCodeAt(0),3432918353);h=h<<13|h>>>19}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')]}

function texLeather(){
  const S=240,C=6,N=S/C,R=rng('leather'),pts=[];
  for(let j=0;j<N;j++)for(let i=0;i<N;i++)pts.push([i*C+R()*C,j*C+R()*C]);
  const H=new Float32Array(S*S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const ci=Math.floor(x/C),cj=Math.floor(y/C);let d1=1e9,d2=1e9;
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){
      const ii=ci+di,jj=cj+dj,p=pts[((jj+N)%N)*N+((ii+N)%N)];
      const px=p[0]+(ii<0?-S:ii>=N?S:0),py=p[1]+(jj<0?-S:jj>=N?S:0);
      const d=Math.hypot(px-x,py-y);if(d<d1){d2=d1;d1=d}else if(d<d2)d2=d;
    }
    H[y*S+x]=Math.min(1,(d2-d1)/2.4);
  }
  const [c,g]=cv(S,S),im=g.createImageData(S,S),D=im.data;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const h=H[y*S+x],hx=H[y*S+(x+1)%S]-H[y*S+(x-1+S)%S],hy=H[((y+1)%S)*S+x]-H[((y-1+S)%S)*S+x];
    const v=25+h*8+(-hx-hy)*20+(R()-.5)*3,k=(y*S+x)*4;
    D[k]=v+1.5;D[k+1]=v;D[k+2]=v-2;D[k+3]=255;
  }
  g.putImageData(im,0,0);return c.toDataURL('image/png');
}
function texBrushed(seed){
  const W=520,H=140,R=rng(seed),[c,g]=cv(W,H);
  g.fillStyle='rgb(128,128,128)';g.fillRect(0,0,W,H);
  for(let i=0;i<2200;i++){
    const y=R()*H,x=R()*W,len=30+R()*300,v=R()<.5?255:0;
    g.strokeStyle=`rgba(${v},${v},${v},${.03+R()*.09})`;g.lineWidth=R()<.85?.6:1.3;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+len,y);g.moveTo(x-W,y);g.lineTo(x-W+len,y);g.stroke();
  }
  return c.toDataURL('image/png');
}
function texPaper(){
  const S=220,R=rng('paper'),[c,g]=cv(S,S);
  for(let i=0;i<2600;i++){g.fillStyle=`rgba(${90+R()*40},${70+R()*30},${40},${.03+R()*.08})`;g.fillRect(R()*S,R()*S,R()<.9?1:2,R()<.9?1:2)}
  g.lineWidth=.6;
  for(let i=0;i<70;i++){const x=R()*S,y=R()*S,a=R()*Math.PI*2,l=4+R()*12;g.strokeStyle=`rgba(120,95,55,${.06+R()*.08})`;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+1)*l/2,y+Math.sin(a+1)*l/2,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  return c.toDataURL('image/png');
}
function texGrain(seed,alpha){
  const S=140,R=rng(seed),[c,g]=cv(S,S),im=g.createImageData(S,S),D=im.data;
  for(let k=0;k<D.length;k+=4){const v=R()<.5?255:0;D[k]=D[k+1]=D[k+2]=v;D[k+3]=R()*alpha}
  g.putImageData(im,0,0);return c.toDataURL('image/png');
}
function texWood(){
  const W=600,H=160,R=rng('wood'),[c,g]=cv(W,H);
  for(let y=0;y<H;y++){
    const w=Math.sin(y*.09+Math.sin(y*.013)*3)*.5+Math.sin(y*.37)*.25;
    g.fillStyle=`rgba(${w>0?255:0},${w>0?200:0},${w>0?150:0},${Math.abs(w)*.09})`;g.fillRect(0,y,W,1);
  }
  for(let i=0;i<260;i++){const y=R()*H,x=R()*W,l=60+R()*260;g.strokeStyle=`rgba(20,8,0,${.08+R()*.14})`;g.lineWidth=.5+R()*.9;g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+l/3,y+(R()-.5)*4,x+2*l/3,y+(R()-.5)*4,x+l,y+(R()-.5)*3);g.stroke()}
  return c.toDataURL('image/png');
}
function applyTextures(){
  const s=document.documentElement.style,t=(k,f)=>{try{s.setProperty(k,`url(${f()})`)}catch(e){}};
  t('--leather-tex',texLeather);t('--brushed',()=>texBrushed('b1'));t('--brushed-dark',()=>texBrushed('b2'));
  t('--paper-tex',texPaper);t('--velvet-tex',()=>texGrain('v',10));t('--crackle',()=>texGrain('c',22));t('--wood',texWood);
}

  const fix=src=>{if(+A.value>+B.value-4){if(src===A)A.value=+B.value-4;else B.value=+A.value+4}
    A.setAttribute('aria-valuetext',yuan(t2p(+A.value)));B.setAttribute('aria-valuetext',yuan(t2p(+B.value)));
    const k=[A.value,B.value].join();if(k!==last){last=k;Sound.play('detent')}onChange(t2p(+A.value),t2p(+B.value))};
  A.addEventListener('input',()=>fix(A));B.addEventListener('input',()=>fix(B));fix(null);
}

function tilt(stage){
  if(!stage||reduceMotion()||matchMedia('(hover: none)').matches)return;
  const cam=stage.querySelector('.cam');
  stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    cam.style.transform=`perspective(1000px) rotateY(${(x*12).toFixed(2)}deg) rotateX(${(-y*8).toFixed(2)}deg) translateZ(10px)`;
    stage.style.setProperty('--gx',((x+.5)*100).toFixed(1)+'%');stage.style.setProperty('--gy',((y+.5)*100).toFixed(1)+'%')});
  stage.addEventListener('pointerleave',()=>{cam.style.transform=''});
}

async function submit(kind,data){
  const rec=Object.assign({kind,ref:refNo(kind),at:new Date().toISOString()},data);
  if(DB&&UID_){
    try{const ref=DB.doc('inbox/'+UID_),snap=await ref.get();
      const items=snap.exists&&Array.isArray(snap.data().items)?snap.data().items.slice():[];
      items.push(rec);await ref.set({items,updated:rec.at});return {ok:true,rec}}catch(e){}
  }
  const box=load('find.outbox',[]);box.push(rec);save('find.outbox',box);
  return {ok:false,rec};
}

/* ---------- 估价 ---------- */
function estimate(model,cat,grade,fn,acc){
  const m=' '+model.toLowerCase()+' ';let base=null,hit=null;
  REF.forEach(([k,v])=>{if(m.includes(k)&&(!hit||k.length>hit.length)){hit=k;base=v}});
  const conf=hit?.75:model.trim()?-.35:-.8;
  if(!base)base=CAT_BASE[cat]||1500;
  let p=base*{'A+':1.15,'A':1.05,'AB':1,'B':.85,'C':.62}[grade];
  fn.forEach(ok=>{if(!ok)p*=.8});acc.forEach(a=>{if(a)p*=1.03});
  return {mid:p,lo:p*.88,hi:p*1.12,hit,conf};
}
const round50=n=>Math.round(n/50)*50;

  APP.innerHTML=`<div class="wrap page">${crumb([['首页','#home'],['器材史']])}
  <div class="sec-h" style="margin-top:14px"><div><h2>器材史 1976–2006</h2><p>转动年份转盘，或者点下面胶片上的任意一格。展柜里是那一年发布的机身和镜头，点一下看它的故事。</p></div></div>
  <div class="hist-top">
    <div class="dial-plate chrome"><div id="y-dial"></div><div class="lcd" id="y-lcd"></div></div>
    <div class="era chrome">${screws()}<div class="tag-era" id="era-tag"></div><h2 id="era-name"></h2><p id="era-d"></p>
      <div class="nav-y"><button class="key" type="button" id="y-prev">◀ 上一年</button><button class="key" type="button" id="y-next">下一年 ▶</button></div></div>
  </div>
  <div class="cabinet"><div class="cab-in"><div class="shelf" id="shelf"></div><div class="shelf-board"></div></div></div>
  <div class="exhibit-info paper" id="ex-info"></div>
  <div class="strip"><div class="strip-in" id="strip">${years.map(y=>{const n=HIST.filter(h=>h.y===y).length,e=ERAS.find(x=>x.from===y);
    return `<button class="fr" type="button" data-y="${y}" aria-label="${y} 年，${n} 台">${e?`<span class="era-mark">▸ ${e.name}</span>`:''}<b>${y}</b><span class="dots">${'<i></i>'.repeat(n)}</span></button>`}).join('')}</div></div>
  </div>`;
  const small=innerWidth<520;
  const dial=Dial($('#y-dial'),{options:years.map(y=>({v:y,t:"'"+String(y).slice(2)})),value:HY-1976,size:small?250:300,arc:330,fs:small?11:12,radius:.37,label:'年份',ticks:false,onChange:v=>{HY=v;HSEL=null;showYear(false)}});
  $('#y-prev').addEventListener('click',()=>{if(HY>1976){HY--;HSEL=null;dial.set(HY-1976,true);Sound.play('detent');showYear(false)}});
  $('#y-next').addEventListener('click',()=>{if(HY<2006){HY++;HSEL=null;dial.set(HY-1976,true);Sound.play('detent');showYear(false)}});
  $$('.fr').forEach(b=>b.addEventListener('click',()=>{HY=+b.dataset.y;HSEL=null;dial.set(HY-1976,true);Sound.play('detent');showYear(false)}));
  showYear(true);
}
function showYear(first){
  $('#y-lcd').textContent=HY;
  const era=ERAS.find(e=>HY>=e.from&&HY<=e.to);
  $('#era-tag').textContent=`Era · ${era.from}–${era.to}`;$('#era-name').textContent=`${HY} 年 · ${era.name}`;$('#era-d').textContent=era.d;
  const items=HIST.filter(h=>h.y===HY),shelf=$('#shelf');
  shelf.style.setProperty('--n',Math.max(1,Math.min(3,items.length)));
  shelf.innerHTML=items.length?items.map(h=>`<button class="exhibit" type="button" data-h="${h.id}" aria-pressed="false"><div class="cam">${camSVG(h.r,h.f,{mark:'',label:h.n})}</div><div class="bp"><b>${esc(h.n)}</b><span>${catName(h.c)} · ${STRUCT[h.t]}</span></div></button>`).join(''):
    `<div class="cab-empty"><p>${HY} 年的柜子还空着。<br>这一年的条目正在整理，先看看前后两年。</p></div>`;
  if(HSEL==null||!items.find(h=>h.id===HSEL))HSEL=items.length?items[0].id:null;
  $$('.exhibit',shelf).forEach(b=>b.addEventListener('click',()=>{HSEL=+b.dataset.h;Sound.play('detent');info()}));
  info();
  $$('.fr').forEach(b=>b.setAttribute('aria-current',+b.dataset.y===HY));
  const cur=$(`.fr[data-y="${HY}"]`),sc=$('.strip');if(cur&&sc)sc.scrollLeft=cur.offsetLeft-sc.clientWidth/2+cur.offsetWidth/2;
}
function info(){
  $$('.exhibit').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.h===HSEL));
  const box=$('#ex-info');const h=HIST[HSEL];
  if(!h){box.hidden=true;return}box.hidden=false;
  const s=STOCK.find(x=>x.hist===h.n&&x.status!=='已售');
  box.innerHTML=`<div><h4>${h.y} · ${catName(h.c)} · ${STRUCT[h.t]}</h4><h3>${esc(h.n)}</h3><p>${h.w}</p></div><div><h4>买它时要看</h4><p>${h.k}</p></div><div>${s?`<a class="key dark" href="#item-${s.id}"><span class="dot"></span>在架上有一台 · ${yuan(s.price)}</a>`:`<a class="key" href="#find">帮我找一台</a>`}</div>`;
}

/* ---------- 收件箱（仅店主与编辑者） ---------- */
function renderInbox(){
  APP.innerHTML=`<div class="wrap page">${crumb([['首页','#home'],['收件箱']])}<div class="ledger paper" style="margin-top:16px"><h1>收件箱</h1><p style="font-size:13.5px;color:var(--paper-ink-2);margin-top:4px">顾客提交的寄售登记、寻物委托和购买预约。只有你和编辑者能看到。</p><div class="tblwrap" id="ib"><p style="margin-top:16px">正在读取……</p></div></div></div>`;
  const ib=$('#ib');
  if(!ADMIN||!DB){ib.innerHTML='<p style="margin-top:16px">这一页只对店主和编辑者开放。</p>';return}
  let got=false;const timer=setTimeout(()=>{if(!got)ib.innerHTML='<p style="margin-top:16px">暂时连不上数据，过一会儿再来看。</p>'},10000);
  if(unsubInbox)unsubInbox();
  unsubInbox=DB.collection('inbox').onSnapshot(snap=>{got=true;clearTimeout(timer);
    const rows=[];snap.docs.forEach(d=>{const x=d.data()||{};(x.items||[]).forEach(r=>rows.push(r))});rows.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
    const K={sell:'寄售',find:'寻物',buy:'预约'};
    ib.innerHTML=rows.length?`<table><thead><tr><th>时间</th><th>类型</th><th>编号</th><th>联系方式</th><th>内容</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(String(r.at).slice(0,16).replace('T',' '))}</td><td>${K[r.kind]||r.kind}</td><td>${esc(r.ref)}</td><td>${esc(r.name||'')}<br>${esc(r.contact||'')}</td><td style="white-space:pre-wrap">${esc(r.summary||'')}</td></tr>`).join('')}</tbody></table>`:
      '<p style="margin-top:16px">还没有提交。顾客在寄售、帮我找、预约购买里提交的内容会出现在这里。</p>'},
    ()=>{got=true;clearTimeout(timer);ib.innerHTML='<p style="margin-top:16px">读取失败，刷新页面再试一次。</p>'});
}

/* ---------- 路由 ---------- */
let PREV=null;const SCROLL={};
function render(h){
  if(unsubInbox&&h!=='inbox'){unsubInbox();unsubInbox=null}
  closeDrawer();
  if(h.startsWith('item-'))renderItem(h.slice(5));
  else ({home:renderHome,shop:renderShop,sell:renderSell,find:renderFind,history:renderHistory,inbox:renderInbox}[h]||renderHome)();
  const key=h.startsWith('item-')?'shop':h;
  $$('.nav a').forEach(a=>a.getAttribute('href')==='#'+key?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
}
async function shutter(fn){
  const c=$('#curtain');
  if(reduceMotion()||!c.animate){fn();return}
  c.style.visibility='visible';Sound.play('shutter');
  try{await c.animate([{transform:'translateY(-101%)'},{transform:'translateY(0)'}],{duration:140,easing:'cubic-bezier(.55,0,.9,.55)',fill:'forwards'}).finished}catch(e){}
  fn();
  try{await c.animate([{transform:'translateY(0)'},{transform:'translateY(101%)'}],{duration:190,easing:'cubic-bezier(.15,.55,.35,1)',fill:'forwards'}).finished}catch(e){}
  c.style.visibility='hidden';
}
function route(){
  const h=location.hash.slice(1)||'home',from=PREV,first=from===null;
  if(!first)SCROLL[from]=scrollY;
  PREV=h;
  const go=()=>{render(h);const y=h==='shop'&&from&&from.startsWith('item-')?SCROLL.shop||0:0;window.scrollTo(0,y);if(!first)APP.focus({preventScroll:true})};
  first?go():shutter(go);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(!b)return;
  Object.assign(SHOP,SHOP0,PRESETS[+b.dataset.preset].s);Sound.play('switch');if(location.hash==='#shop')renderShop();else location.hash='#shop'});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){const q=$('#q');if(q){e.preventDefault();q.focus()}}});
$('#skip').addEventListener('click',()=>{APP.focus();APP.scrollIntoView()});
$('#fc').addEventListener('click',e=>{SHOP.watch=true;SHOP.hideSold=false;if(location.hash==='#shop'){e.preventDefault();renderShop()}});
$('#snd').addEventListener('toggle',e=>{Sound.on=e.detail;save('find.sound',e.detail);if(e.detail){Sound.init();Sound.play('shutter')}});
window.addEventListener('hashchange',route);
applyTextures();
$('#fc-n').textContent=WATCH.size;
route();
</script>
